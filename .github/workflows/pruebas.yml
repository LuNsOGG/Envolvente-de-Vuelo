name: Pruebas Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.runtime/pip-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -B -c "import bootstrap,pytest; raise SystemExit(pytest.main(['tests','-q','-p','no:cacheprovider','--junitxml=outputs/qa/pruebas.xml']))"
      - name: Comprobación de ejemplos
        run: python -B main.py --comprobar
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacion-windows
          path: outputs/qa/
          if-no-files-found: warn
          retention-days: 14
